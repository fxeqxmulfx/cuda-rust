[package]
name = "launch-overhead-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[[bin]]
name = "launch_overhead"
path = "src/main.rs"

[[bin]]
name = "async_throughput"
path = "src/bin/async_throughput.rs"

[dependencies]
cuda-core = "0.4.0"
cuda-async = { version = "0.4.0" }
cutile = "0.4.0"
cutile-macro = "0.4.0"
cutile-compiler = "0.4.0"
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"

[workspace]

[patch.crates-io]
cuda-async = { path = "../../../../../cuda-async" }
cuda-core = { path = "../../../../../cuda-core" }
cuda-bindings = { path = "../../../../../cuda-bindings" }
cutile = { path = "../../../../cutile" }
cutile-macro = { path = "../../../../cutile-macro" }
cutile-compiler = { path = "../../../../cutile-compiler" }
cutile-ir = { path = "../../../../cutile-ir" }

